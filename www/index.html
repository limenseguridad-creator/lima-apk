<!DOCTYPE html>
<html lang="es" data-lima-state="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LIMA">
<meta name="theme-color" content="#080b14">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/img/lima_frente.png">
<title>LIMA · LIMEN Seguridad</title>
<style>
:root{
  --bg:#080b14;--bg2:#0f1520;--bg3:#141c2e;
  --border:rgba(129,140,248,.13);--border2:rgba(129,140,248,.22);
  --p:#818cf8;--pD:#4338ca;--pL:#a5b4fc;
  --red:#ef4444;--green:#22c55e;--orange:#f59e0b;--cyan:#06b6d4;
  --text:#f1f5f9;--text2:#cbd5e1;--muted:#64748b;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --hdr-h:calc(var(--safe-t) + 56px);--chat-h:calc(var(--safe-b) + 168px);
  --c-main:#818cf8;--c-glow:#a5b4fc;--c-dark:#4338ca;--c-dim:rgba(129,140,248,.12);
  --violet-main:#818cf8;--violet-glow:#a5b4fc;--violet-dark:#4338ca;--violet-dim:rgba(129,140,248,.12);
  --red-main:#ef4444;--red-glow:#f87171;--red-dark:#991b1b;--red-dim:rgba(239,68,68,.12);
  --green-main:#22c55e;--green-glow:#4ade80;--green-dark:#166534;--green-dim:rgba(34,197,94,.12);
  --amber-main:#f59e0b;--amber-glow:#fbbf24;--amber-dark:#92400e;--amber-dim:rgba(245,158,11,.12);
}
[data-lima-state="violet"],[data-lima-state="violet"] body{--c-main:#818cf8;--c-glow:#a5b4fc;--c-dark:#4338ca;--c-dim:rgba(129,140,248,.12)}
[data-lima-state="red"]   ,[data-lima-state="red"] body{--c-main:#ef4444;--c-glow:#f87171;--c-dark:#991b1b;--c-dim:rgba(239,68,68,.12)}
[data-lima-state="green"] ,[data-lima-state="green"] body{--c-main:#22c55e;--c-glow:#4ade80;--c-dark:#166534;--c-dim:rgba(34,197,94,.12)}
[data-lima-state="amber"] ,[data-lima-state="amber"] body{--c-main:#f59e0b;--c-glow:#fbbf24;--c-dark:#92400e;--c-dim:rgba(245,158,11,.12)}
body.lima-red   {--c-main:#ef4444;--c-glow:#f87171;--c-dark:#991b1b;--c-dim:rgba(239,68,68,.12)}
body.lima-green {--c-main:#22c55e;--c-glow:#4ade80;--c-dark:#166534;--c-dim:rgba(34,197,94,.12)}
body.lima-amber {--c-main:#f59e0b;--c-glow:#fbbf24;--c-dark:#92400e;--c-dim:rgba(245,158,11,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
#login{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:var(--bg)}
#login.hide{display:none}
.login-logo{width:72px;height:72px;object-fit:cover;border-radius:14px;border:1px solid var(--border2);margin-bottom:18px}
.login-name{font-size:26px;font-weight:800;letter-spacing:7px;color:var(--pL);margin-bottom:2px}
.login-sub{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.login-build{font-size:9px;color:rgba(129,140,248,.35);letter-spacing:2px;text-transform:uppercase;margin-bottom:28px}
.login-card{width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px}
.lf{display:flex;flex-direction:column;gap:5px}
.lf label{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.lf input{background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:12px 16px;border-radius:10px;font-size:14px;outline:none;transition:border-color .2s}
.lf input:focus{border-color:var(--p)}
.btn-login{background:var(--p);color:#fff;border:none;padding:13px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;transition:opacity .2s}
.btn-login:disabled{opacity:.5}
#login-err{font-size:12px;color:var(--red);text-align:center;min-height:16px}
#header{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(var(--safe-t) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid var(--border)}
#hdr-name{font-size:17px;font-weight:800;letter-spacing:4px;color:var(--pL)}
#hdr-sub{font-size:8px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
#hdr-center{flex:1;display:flex;justify-content:center}
#estado-badge{display:none;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--bg2);transition:border-color .4s}
#estado-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .4s,box-shadow .4s}
#estado-txt{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);transition:color .4s}
#hdr-right{display:flex;align-items:center;gap:8px}
#hdr-hora{font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums}
#hdr-usuario{display:none}
#btn-settings{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
#btn-settings:active{background:var(--bg3)}
#btn-logout{display:none}
body.st-armado    #estado-dot{background:var(--red);box-shadow:0 0 6px var(--red)}
body.st-armado    #estado-txt{color:var(--red)}
body.st-armado    #estado-badge{border-color:rgba(239,68,68,.35)}
body.st-desarmado #estado-dot{background:var(--green);box-shadow:0 0 6px var(--green)}
body.st-desarmado #estado-txt{color:var(--green)}
body.st-desarmado #estado-badge{border-color:rgba(34,197,94,.35)}
body.st-panico    #estado-dot{background:var(--orange);animation:blink-d .5s infinite alternate}
body.st-panico    #estado-txt{color:var(--orange)}
body.st-bloqueado #estado-dot{background:var(--cyan)}
body.st-bloqueado #estado-txt{color:var(--cyan)}
@keyframes blink-d{from{opacity:.4}to{opacity:1}}
#main-wrap{position:fixed;top:var(--hdr-h);left:0;right:0;bottom:var(--chat-h);overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:11px;scrollbar-width:none}
#main-wrap::-webkit-scrollbar{display:none}
.status-card-main{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;transition:border-color .5s,background .5s}
body.st-armado    .status-card-main{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.05)}
body.st-desarmado .status-card-main{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.05)}
body.st-panico    .status-card-main{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.07)}
.sc-left{display:flex;flex-direction:column;gap:3px}
.sc-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.sc-value{font-size:20px;font-weight:800;letter-spacing:1.5px;color:var(--text);transition:color .5s}
body.st-armado    .sc-value{color:var(--red)}
body.st-desarmado .sc-value{color:var(--green)}
body.st-panico    .sc-value{color:var(--orange);animation:blink-d .5s infinite alternate}
body.st-bloqueado .sc-value{color:var(--cyan)}
.sc-sub{font-size:11px;color:var(--muted);margin-top:2px}
.sc-ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border:1px solid var(--border);transition:all .5s;flex-shrink:0}
body.st-armado    .sc-ico{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3)}
body.st-desarmado .sc-ico{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3)}
body.st-panico    .sc-ico{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3)}
.sc-ico svg{width:20px;height:20px;stroke:var(--p);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .5s}
body.st-armado    .sc-ico svg{stroke:var(--red)}
body.st-desarmado .sc-ico svg{stroke:var(--green)}
body.st-panico    .sc-ico svg{stroke:var(--orange)}
.tiles-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:15px 13px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:8px;transition:background .2s,transform .15s;touch-action:manipulation;color:var(--text);text-align:left}
.tile:active{background:var(--bg3);transform:scale(.96)}
.tile.locked{opacity:.25;pointer-events:none}
.tile-ico-wrap{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border:1px solid var(--border);flex-shrink:0}
.tile-ico-wrap svg{width:17px;height:17px;stroke:var(--p);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tile-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.2}
.tile-sub{font-size:10px;color:var(--muted);margin-top:1px}
.alarma-status{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--bg3);color:var(--muted);border:1px solid var(--border);transition:all .4s}
.alarma-status.arm{background:rgba(239,68,68,.1);color:#f87171;border-color:rgba(239,68,68,.4)}
.alarma-status.des{background:rgba(34,197,94,.1);color:#4ade80;border-color:rgba(34,197,94,.4)}
.alarma-status.pan{background:rgba(245,158,11,.1);color:#fbbf24;border-color:rgba(245,158,11,.4);animation:blink-d .5s infinite alternate}
.tile-panico{grid-column:1/-1;background:rgba(239,68,68,.05);border-color:rgba(239,68,68,.2);flex-direction:row;align-items:center;padding:15px 18px;gap:14px}
.tile-panico .tile-ico-wrap{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.25)}
.tile-panico .tile-ico-wrap svg{stroke:var(--red)}
.tile-panico .tile-name{font-size:15px;font-weight:700;color:var(--red);letter-spacing:.5px}
.tile-panico:active{background:rgba(239,68,68,.12)}
.tile-panico.locked .tile-ico-wrap svg{stroke:var(--muted)}
.tile-panico.locked .tile-name{color:var(--muted)}
#lima-state-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0 6px;transition:color .3s;pointer-events:none}
#lima-state-lbl.speaking{color:var(--pL)}
#lima-state-lbl.listening{color:var(--cyan)}
#chat-panel{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;flex-direction:column;background:var(--bg);border-top:1px solid var(--border);padding-bottom:var(--safe-b)}
#chat-topbar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:5px 12px 4px;border-bottom:1px solid var(--border)}
#chat-topbar-lbl{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);flex:1}
#btn-tts{font-size:9px;color:var(--muted);background:none;border:1px solid var(--border);cursor:pointer;padding:2px 8px;border-radius:6px}
#btn-tts.on{border-color:var(--p);color:var(--pL)}
#btn-clear{font-size:9px;color:var(--muted);background:none;border:none;cursor:pointer;padding:2px 8px}
#chat{height:82px;overflow-y:auto;padding:5px 12px 3px;display:flex;flex-direction:column;gap:4px;scrollbar-width:none;transition:height .25s ease}
#chat.expanded{height:200px}
#chat::-webkit-scrollbar{display:none}
.msg{display:flex;gap:6px;max-width:88%;animation:msgIn .2s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.lima{align-self:flex-start}
.msg-av{width:22px;height:22px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;overflow:hidden}
.msg.lima .msg-av{background:linear-gradient(135deg,var(--pD),var(--p));color:#fff}
.msg.user .msg-av{background:var(--bg3);border:1px solid var(--border);color:var(--muted)}
.msg-inner{max-width:100%;display:flex;flex-direction:column;gap:2px}
.msg-bubble{padding:5px 10px;border-radius:10px;font-size:11px;line-height:1.4}
.msg.user .msg-bubble{background:rgba(67,56,202,.5);color:#fff;border-bottom-right-radius:3px}
.msg.lima .msg-bubble{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-bottom-left-radius:3px}
.msg.lima.intent-activar    .msg-bubble{border-color:rgba(239,68,68,.4)}
.msg.lima.intent-desactivar .msg-bubble{border-color:rgba(34,197,94,.4)}
.msg.lima.intent-panico     .msg-bubble{border-color:rgba(245,158,11,.4)}
.msg-time{font-size:8px;color:var(--muted);padding:0 4px}
.msg.user .msg-time{text-align:right}
#typing{align-self:flex-start;display:none;gap:6px;padding:2px 0}
#typing.show{display:flex}
.typing-av{width:22px;height:22px;border-radius:6px;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,var(--pD),var(--p));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px}
.typing-dots{display:flex;align-items:center;gap:4px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;border-bottom-left-radius:3px;padding:8px 12px}
.typing-dots span{width:5px;height:5px;border-radius:50%;background:var(--p);display:block;animation:dot .9s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
#chat-empty{align-self:center;text-align:center;padding:14px 0;color:var(--muted);font-size:11px;letter-spacing:1px}
#input-bar{flex-shrink:0;display:flex;gap:8px;padding:6px 12px 8px;border-top:1px solid var(--border);align-items:flex-end}
#inp{flex:1;background:var(--bg2);border:1px solid var(--border2);color:var(--text);padding:8px 12px;border-radius:10px;font-size:13px;outline:none;resize:none;max-height:80px;overflow-y:auto;transition:border-color .2s;font-family:inherit;line-height:1.4}
#inp:focus{border-color:var(--p)}
#inp::placeholder{color:var(--muted)}
.ibtn{width:40px;height:40px;border-radius:10px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;transition:all .2s;flex-shrink:0}
#btn-send{background:var(--p);color:#fff}
#btn-send:disabled{opacity:.4}
#btn-mic-in{background:var(--bg2);border:1px solid rgba(129,140,248,.3);color:var(--pL);font-size:13px;padding:0 14px;min-width:90px;font-weight:700}
#btn-mic-in.recording{background:rgba(239,68,68,.1);border-color:var(--red);color:var(--red);animation:blink-d .6s infinite alternate}
#btn-chat-toggle{display:none}
#pin-overlay{position:fixed;inset:0;z-index:500;background:rgba(8,9,14,.96);backdrop-filter:blur(12px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px}
#pin-overlay.show{display:flex}
#pin-title{font-size:13px;letter-spacing:2px;color:var(--pL);text-transform:uppercase}
#pin-dots{display:flex;gap:12px}
.pin-dot{width:13px;height:13px;border-radius:50%;background:var(--bg3);border:2px solid var(--border2);transition:all .2s}
.pin-dot.filled{background:var(--p);border-color:var(--p);box-shadow:0 0 8px rgba(129,140,248,.5)}
#pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:210px}
.pin-key{background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:12px;padding:15px;font-size:18px;font-weight:700;cursor:pointer;text-align:center;transition:all .2s}
.pin-key:active{background:rgba(129,140,248,.15);border-color:var(--p)}
#pin-cancel{font-size:11px;color:var(--muted);background:none;border:none;cursor:pointer;padding:6px 16px;letter-spacing:1px;text-transform:uppercase}
#pin-err{font-size:12px;color:var(--red);min-height:16px;letter-spacing:1px}
#mod-panel{position:fixed;inset:0;z-index:800;background:rgba(8,9,14,.97);backdrop-filter:blur(12px);display:none;flex-direction:column;padding:calc(var(--safe-t) + 24px) 24px 24px;gap:14px;overflow-y:auto}
#mod-panel.show{display:flex}
.mod-list{display:flex;flex-direction:column;gap:10px}
.mod-item{display:flex;align-items:center;gap:14px;padding:14px;background:var(--bg3);border:1px solid var(--border);border-radius:12px}
.mod-ico{font-size:20px;width:32px;text-align:center}
.mod-info{flex:1}
.mod-name{font-size:13px;font-weight:600;color:var(--text)}
.mod-desc{font-size:11px;color:var(--muted);margin-top:2px}
.mod-badge{padding:2px 9px;border-radius:10px;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.mod-badge.on{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35);color:var(--green)}
.mod-badge.off{background:var(--bg);border:1px solid var(--border);color:var(--muted)}
#mod-close{background:var(--bg3);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:12px;cursor:pointer;font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-top:auto}
#modulo-panel{position:fixed;inset:0;z-index:600;background:rgba(8,9,14,.96);backdrop-filter:blur(16px);display:none;flex-direction:column;overflow:hidden}
#modulo-panel.show{display:flex}
#modulo-header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-t) + 16px) 20px 14px;border-bottom:1px solid var(--border);background:var(--bg2)}
#modulo-titulo{font-size:13px;font-weight:700;color:var(--pL);letter-spacing:2px;text-transform:uppercase}
#modulo-header button{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
#modulo-body{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.mod-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.mod-card-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mod-estado-badge{padding:5px 14px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.mod-estado-badge.armado{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:var(--red)}
.mod-estado-badge.desarmado{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35);color:var(--green)}
.mod-estado-badge.desconocido{background:var(--bg3);border:1px solid var(--border);color:var(--muted)}
.mod-estado-badge.alarma{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);color:var(--orange)}
.mod-evento-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid rgba(129,140,248,.07);font-size:12px}
.mod-evento-row:last-child{border-bottom:none}
.mod-evento-fecha{color:var(--muted);flex-shrink:0;font-size:10px;margin-top:1px}
.mod-evento-desc{color:var(--text);flex:1;line-height:1.4}
.mod-label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.mod-value{font-size:15px;font-weight:700;color:var(--text)}
.mod-value.online{color:var(--green)}
.mod-value.offline{color:var(--muted)}
.mod-btn{background:var(--p);color:#fff;border:none;border-radius:10px;padding:12px;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:1px;width:100%;transition:opacity .2s}
.mod-btn:active{opacity:.8}
.mod-btn.danger{background:var(--red)}
.mod-btn.secondary{background:rgba(129,140,248,.1);border:1px solid var(--border2);color:var(--pL)}
.mod-spinner{text-align:center;padding:40px;color:var(--muted);font-size:13px;letter-spacing:1px}
.mod-error{text-align:center;padding:30px;color:var(--red);font-size:13px}
.ha-device{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(129,140,248,.07)}
.ha-device:last-child{border-bottom:none}
.ha-device-name{flex:1;font-size:13px;color:var(--text)}
.ha-device-domain{font-size:10px;color:var(--muted);margin-top:2px}
.ha-toggle{width:44px;height:24px;border-radius:12px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.ha-toggle.on{background:var(--p)}
.ha-toggle.off{background:rgba(129,140,248,.15);border:1px solid var(--border2)}
.ha-toggle::after{content:'';position:absolute;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.ha-toggle.on::after{left:23px}
.ha-toggle.off::after{left:3px}
#panic-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.panic-opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px 10px;border-radius:16px;border:1px solid rgba(239,68,68,.2);background:rgba(239,68,68,.04);cursor:pointer;transition:all .18s;user-select:none}
.panic-opt:active{transform:scale(.92)}
.panic-opt svg{width:38px;height:38px;flex-shrink:0}
.panic-opt span{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;line-height:1.4}
.panic-opt.p-sonoro    {border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.06)}
.panic-opt.p-silencioso{border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.06)}
.panic-opt.p-fuego     {border-color:rgba(249,115,22,.35);background:rgba(249,115,22,.06)}
.panic-opt.p-ayuda     {border-color:rgba(99,102,241,.35);background:rgba(99,102,241,.06)}
.panic-opt.p-sonoro:active    {background:rgba(239,68,68,.16)}
.panic-opt.p-silencioso:active{background:rgba(245,158,11,.16)}
.panic-opt.p-fuego:active     {background:rgba(249,115,22,.16)}
.panic-opt.p-ayuda:active     {background:rgba(99,102,241,.16)}
.cam-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:4px}
.cam-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
.cam-name{font-size:13px;font-weight:700;color:var(--pL)}
.cam-loc{font-size:10px;color:var(--muted)}
.cam-player-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center}
.cam-video{width:100%;height:100%;object-fit:cover}
.cam-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}
.cam-play-btn{background:rgba(129,140,248,.2);border:1px solid var(--p);color:var(--pL);border-radius:12px;padding:12px 20px;cursor:pointer;text-align:center;touch-action:manipulation}
.cam-play-btn:active{background:rgba(129,140,248,.4)}
#toast{position:fixed;bottom:calc(var(--safe-b) + 180px);left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:9px 16px;font-size:13px;z-index:900;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center;backdrop-filter:blur(10px)}
#toast.show{opacity:1}
#toast.t-ok{border-color:rgba(34,197,94,.4);color:var(--green)}
#toast.t-err{border-color:rgba(239,68,68,.4);color:var(--red)}
#lima-label,#bg-rings{display:none}
#lima-orb-wrap{display:none}
.side-col,.sbtn{display:none}

<script>
// ════════════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════════════
const API_BASE = 'https://lima.limenseguridad.com'
const API = API_BASE + '/comando'
const TK  = 'lima_token'
const UK  = 'lima_user'
const MK  = 'lima_mods'

const IMGS = {}  // imágenes reemplazadas por esfera de partículas

const ALL_MODS = [
  {id:'alarma',  ico:'🔔', name:'Alarma',    desc:'Control de armado y zonas'},
  {id:'gps',     ico:'📍', name:'GPS',       desc:'Seguimiento de vehículos'},
  {id:'casa',    ico:'🏠', name:'Hogar',     desc:'Control del hogar'},
  {id:'camara',  ico:'📷', name:'Cámara',    desc:'Monitoreo de cámaras'},
  {id:'notif',   ico:'🔔', name:'Alertas',   desc:'Notificaciones y eventos'},
  {id:'edificio',ico:'🏢', name:'Edificio',  desc:'Acceso y control de edificio'},
]

// Comandos por botón
const BTN_CMDS = {
  alarma:   '¿Cuál es el estado de mi alarma?',
  hogar:    '¿Cuál es el estado de mi hogar?',
  gps:      '¿Dónde está mi vehículo?',
  edificio: '¿Cuál es el estado de mi edificio?',
}

const getToken   = () => localStorage.getItem(TK)
const getUsuario = () => { try { return JSON.parse(localStorage.getItem(UK)||'null') } catch { return null } }
const getMods    = () => { try { return JSON.parse(localStorage.getItem(MK)||'[]') } catch { return [] } }

// ════════════════════════════════════════════════════
//  AVATAR — ORB V3 (CSS/SVG, no canvas)
// ════════════════════════════════════════════════════
const limaLbl  = document.getElementById('lima-label')
let avatarState = 'idle'
let blinkTimer  = null
let glanceTimer = null
let blinkLocked = false

const IS_MOBILE = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)

// voiceWave stub — wave canvas removed, kept for compatibility
const voiceWave = { amp:0, target:0, freq:3.5, _t:null }

// Compatibilidad: setImg/setAnim no hacen nada
function setImg(key) {}
function setAnim(cls) {}

function setAvatarState(state) {
  avatarState = state
  const lbl   = document.getElementById('lima-state-lbl')
  clearTimeout(blinkTimer)
  clearTimeout(glanceTimer)
  blinkLocked = false

  const labels = {
    idle:       'En espera',
    listening:  'Escuchando...',
    speaking:   'Respondiendo...',
    processing: 'Procesando...',
    correcto:   'Código correcto',
    error:      'Error',
  }
  if (limaLbl) limaLbl.textContent = labels[state] || ''
  if (lbl) {
    lbl.textContent = labels[state] || ''
    lbl.className   = (state==='speaking'||state==='processing'||state==='error') ? 'speaking' : (state==='listening' ? 'listening' : '')
  }

  switch(state) {
    case 'idle':
      scheduleBlink()
      scheduleGlance()
      break
    case 'correcto':
    case 'error':
      setTimeout(() => setAvatarState('idle'), 3000)
      break
  }
}

// Blink y glance son no-ops visuales pero mantenemos los timers para compatibilidad
function triggerBlink() {
  if (blinkLocked) return
  blinkLocked = true
  setTimeout(() => { blinkLocked = false }, 300)
}

function scheduleBlink() {
  clearTimeout(blinkTimer)
  blinkTimer = setTimeout(() => {
    if (avatarState === 'idle') triggerBlink()
    scheduleBlink()
  }, 3000 + Math.random() * 5000)
}

function scheduleGlance() {
  clearTimeout(glanceTimer)
  glanceTimer = setTimeout(() => {
    scheduleGlance()
  }, 5000 + Math.random() * 6000)
}


// setWaveState — stub for compatibility (wave canvas removed)
function setWaveState(s) {}

// ════════════════════════════════════════════════════
//  ORB V3 — inicialización de partículas
// ════════════════════════════════════════════════════
function expandirChat() {
  var ch = document.getElementById('chat')
  ch.classList.toggle('expanded')
  ch.scrollTop = ch.scrollHeight
}

function initOrb() {
  const container = document.getElementById('orb-particles');
  if (!container) return;
  const orbitFactors = [0.5,0.75,1.1,1.6,2.2,3.0,4.0,5.2,6.6,0.6,0.9,1.4,1.9,2.7,3.6,4.8,6.0,7.5];
  const durations   = [3,4,5,7,9,12,16,20,25,3.5,4.5,6,8,10,14,18,22,28];
  const sizes       = [4.5,4.5,4.5,3.5,3.5,3.5,3,3,3,4.5,4.5,3.5,3.5,3,3,2.5,2.5,2.5];
  const colors      = ['#fff','var(--c-glow)','var(--c-main)'];
  orbitFactors.forEach((f,i) => {
    const r = Math.round(f * 100);
    const sz = sizes[i] || 3;
    const col = colors[i % 3];
    const delay = -(Math.random() * durations[i]);
    const div = document.createElement('div');
    div.className = 'particle';
    div.style.cssText = `--r:${r}px;--dur:${durations[i]}s;--delay:${delay.toFixed(2)}s;--sz:${sz}px;--dot-color:${col}`;
    div.innerHTML = `<div class="particle-dot"></div><div class="particle-dot2"></div>`;
    container.appendChild(div);
  });
}

// ════════════════════════════════════════════════════
//  LIMA STATE — color class management
// ════════════════════════════════════════════════════
function setLimaState(state) {
  // Sistema principal: data-lima-state en html tag (cambia todos los CSS vars)
  document.documentElement.dataset.limaState = state || 'violet';
  // Compatibilidad: también actualiza body classes
  document.body.classList.remove('lima-red','lima-green','lima-amber','lima-active');
  if (state === 'red')   { document.body.classList.add('lima-red','lima-active'); }
  if (state === 'green') { document.body.classList.add('lima-green','lima-active'); }
  if (state === 'amber') { document.body.classList.add('lima-amber','lima-active'); }
  // Actualizar label de estado del orbe
  const lbl = document.getElementById('lima-state-lbl');
  if (lbl) {
    const labels = { violet:'◈ procesando', red:'⚠ alerta activa', green:'✓ sistema OK', amber:'◈ hogar activo' };
    lbl.textContent = labels[state] || '◈ procesando';
  }
}

// ════════════════════════════════════════════════════
//  ESTADO SISTEMA
// ════════════════════════════════════════════════════
function setEstado(estado, label) {
  // Preserve non-alarm body classes (lima-red, lima-green, etc.) — only update st-* class
  document.body.classList.remove('st-armado','st-desarmado','st-panico','st-bloqueado')
  document.body.classList.add('st-' + estado)
  document.getElementById('estado-txt').textContent = label.toUpperCase()
  // Update status card
  var smcV = document.getElementById('smc-value')
  var smcS = document.getElementById('smc-sub')
  if (smcV) smcV.textContent = label.toUpperCase()
  if (smcS) {
    var subs = {armado:'Sistema monitoreado',desarmado:'Sin eventos activos',panico:'ALERTA ACTIVA',bloqueado:'Acceso bloqueado'}
    smcS.textContent = subs[estado] || ''
  }
  var eb = document.getElementById('estado-badge')
  if (eb) eb.style.display = 'flex' 
  const aS = document.getElementById('alarma-status')
  if (aS) {
    aS.className = 'alarma-status'
    if (estado === 'armado')    { aS.classList.add('arm'); aS.textContent = '● ARMADO' }
    else if (estado === 'desarmado') { aS.classList.add('des'); aS.textContent = '● DESARMADO' }
    else if (estado === 'panico')    { aS.classList.add('pan'); aS.textContent = '⚠ PÁNICO' }
    else { aS.textContent = '—' }
  }
  // Update orb state color — armado (standby) keeps violet, only active events go red
  if (estado === 'panico') setLimaState('red')
  else if (estado === 'desarmado') {
    setLimaState('green')
    setTimeout(() => setLimaState('violet'), 3000)
  }
  else if (estado === 'armado') { /* keep current orb color — standby armed is not an emergency */ }
  else setLimaState('violet')
}

// ════════════════════════════════════════════════════
//  HORA
// ════════════════════════════════════════════════════
function actualizarHora() {
  const n = new Date()
  document.getElementById('hdr-hora').textContent =
    String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0')
}

// ════════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════════
let _tt
function toast(msg, tipo='') {
  const el = document.getElementById('toast')
  el.textContent = msg
  el.className = 'show' + (tipo ? ' t-'+tipo : '')
  clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), 3200)

function ahora() {
  const n = new Date()
  return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')
}

function addMsg(texto, lado, intent) {
  document.getElementById('chat-empty').style.display = 'none'
  const wrap = document.createElement('div')
  wrap.className = `msg ${lado}` + (intent ? ` intent-${intent}` : '')
  const av = document.createElement('div'); av.className = 'msg-av'
  if (lado === 'lima') { av.style.background='linear-gradient(135deg,#7c3aed,#4f46e5)'; av.textContent='L'; av.style.cssText+=';color:#fff;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center' }
  else av.textContent = '👤'
  const inner = document.createElement('div'); inner.className = 'msg-inner'
  const bub = document.createElement('div'); bub.className = 'msg-bubble'; bub.textContent = texto
  const tm  = document.createElement('div'); tm.className = 'msg-time'; tm.textContent = ahora()
  inner.appendChild(bub); inner.appendChild(tm)
  wrap.appendChild(av); wrap.appendChild(inner)
  chatEl.insertBefore(wrap, typingEl)
  requestAnimationFrame(() => { chatEl.scrollTop = chatEl.scrollHeight })
}

// ════════════════════════════════════════════════════
//  AUDIO (beeps)
// ════════════════════════════════════════════════════
const AC = window.AudioContext || window.webkitAudioContext
let actx
function beep(f=660,d=.08,v=.18) {
  if(!actx) actx = new AC()
  const o=actx.createOscillator(),g=actx.createGain()
  o.connect(g);g.connect(actx.destination)
  o.frequency.value=f;g.gain.setValueAtTime(v,actx.currentTime)
  g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d)
  o.start();o.stop(actx.currentTime+d)
}
function beepOk()    { beep(660,.07);setTimeout(()=>beep(880,.09),100) }
function beepErr()   { beep(220,.25,.3) }
function beepAlarm() { beep(880,.1);setTimeout(()=>beep(880,.1),150);setTimeout(()=>beep(1100,.2),300) }
function beepPanic() { for(let i=0;i<5;i++) setTimeout(()=>beep(1200,.1,.4),i*120) }

// ════════════════════════════════════════════════════
//  RESPUESTA IA
// ════════════════════════════════════════════════════
let bloqueado = false

function handleRespuesta(data) {
  setTyping(false)
  btnSend.disabled = false
  const intent = data.intent || 'desconocido'
  addMsg(data.respuesta, 'lima', intent)
  // Mostrar animación según resultado
  if (data.intent === 'desactivar' || data.intent === 'activar' || data.intent === 'armar_parcial') {
    if (data.esperandoPin) {
      // nada, ya está en speaking
    }
  }
  if (data.intent && data.intent.includes('correcto') || (data.respuesta && data.respuesta.toLowerCase().includes('código correcto'))) {
    setTimeout(() => setAvatarState('correcto'), 200)
  } else if (data.intent === 'pin_incorrecto' || data.intent === 'bloqueado' || data.intent === 'error') {
    setTimeout(() => setAvatarState('error'), 200)
  }
  hablarRespuesta(data.respuesta)
  if (!ttsEnabled) setAvatarState('idle')
  if (data.esperandoPin) { mostrarPin(); return }
  switch(intent) {
    case 'activar':
      setEstado('armado','Armado'); beepAlarm()
      break
    case 'desactivar':
      setEstado('desarmado','Desarmado'); beepOk()
      break
    case 'panico':
      setEstado('panico','PÁNICO'); beepPanic()
      if(navigator.vibrate) navigator.vibrate([300,100,300,100,300])
      break
    case 'bloqueado':
      setEstado('bloqueado','Bloqueado'); beepErr()
      bloqueado = true
      setTimeout(()=>{ bloqueado=false; setEstado('desarmado','Desarmado') }, 60000)
      break
    case 'error': beepErr(); break
    default: if(data.respuesta) beepOk()
  }
}

async function enviar() {
  const texto = inp.value.trim()
  if (!texto || bloqueado) return
  addMsg(texto, 'user')
  inp.value = ''; inp.style.height = 'auto'
  setTyping(true); btnSend.disabled = true
  setAvatarState('processing')
  const u = getUsuario()
  try {
    const r = await fetch(API, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+(getToken()||'')},
      body: JSON.stringify({ texto, usuario: u?.nombre || 'usuario' })
    })
    const d = await r.json()
    if (r.status === 401) { logout(); return }
    handleRespuesta(d)
  } catch {
    setTyping(false); btnSend.disabled=false; setAvatarState('idle')
    addMsg('Error de conexión con LIMA.','lima','error'); beepErr()
  }
}

async function abrirModuloAlarma() {
  _abrirModulo('🔔 Mi Alarma')
  try {
    const hdr = { Authorization: 'Bearer ' + (getToken() || '') }
    const [r, rb] = await Promise.all([
      fetch(API_BASE + '/api/modulo/alarma', { headers: hdr }),
      fetch(API_BASE + '/api/modulo/alarma/bridge', { headers: hdr })
    ])
    const d  = await r.json()
    const br = rb.ok ? await rb.json() : { online: false, panel_estado: 'desconocido' }
    if (!d.ok) {
      document.getElementById('modulo-body').innerHTML = `<div class="mod-error">${d.error || 'Sin datos'}</div>`
      return
    }
    const ec = d.estado === 'armado' ? 'armado'
             : d.estado === 'desarmado' ? 'desarmado'
             : (d.estado === 'alarma' || d.estado === 'panico') ? 'alarma'
             : 'desconocido'
    const el = { armado:'Armado', desarmado:'Desarmado', alarma:'ALARMA', panico:'PÁNICO', desconocido:'Desconocido' }[d.estado] || d.estado
    const evHtml = (d.eventos || []).map(ev => {
      const f = ev.fecha ? new Date(ev.fecha).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''
      return `<div class="mod-evento-row">
        <div class="mod-evento-fecha">${f}</div>
        <div class="mod-evento-desc">${ev.descripcion || ev.zona || '—'}</div>
      </div>`
    }).join('')
    const bridgeHtml = br.online
      ? `<div class="mod-card" style="gap:10px">
          <div class="mod-label" style="margin-bottom:2px">Control del panel</div>
          <div style="display:flex;gap:8px">
            <button class="mod-btn danger" style="flex:1" onclick="comandoAlarma('armar')">🔒 Armar</button>
            <button class="mod-btn" style="flex:1;background:linear-gradient(135deg,#065f46,#10b981)" onclick="comandoAlarma('desarmar')">🔓 Desarmar</button>
          </div>
          <button class="mod-btn secondary" onclick="comandoAlarma('parcial')">🏠 Armado Parcial</button>
        </div>`
      : `<div class="mod-card" style="text-align:center;padding:12px">
          <div style="font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase">Panel no conectado</div>
          <div style="font-size:10px;color:var(--muted);margin-top:4px">Bridge offline — instalar dispositivo LIMA Bridge</div>
        </div>`
    document.getElementById('modulo-body').innerHTML = `
      <div class="mod-card">
        <div class="mod-card-row">
          <div><div class="mod-label">Estado actual</div></div>
          <div class="mod-estado-badge ${ec}">${el}</div>
        </div>
      </div>
      ${bridgeHtml}
      ${d.eventos?.length ? `<div class="mod-card">
        <div class="mod-label" style="margin-bottom:6px">Últimos eventos</div>
        ${evHtml}
      </div>` : ''}
    `
    if (d.estado === 'armado') setEstado('armado','Armado')
    else if (d.estado === 'desarmado') setEstado('desarmado','Desarmado')
    else if (d.estado === 'alarma' || d.estado === 'panico') setEstado('panico', el)
  } catch {
    document.getElementById('modulo-body').innerHTML = '<div class="mod-error">Error de conexión</div>'
  }
}

async function comandoAlarma(accion) {
  const btns = document.querySelectorAll('#modulo-body .mod-btn')
  btns.forEach(b => { b.disabled = true; b.style.opacity = '0.5' })
  try {
    const r = await fetch(API_BASE + '/api/modulo/alarma/comando', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', Authorization: 'Bearer ' + (getToken() || '') },
      body: JSON.stringify({ accion })

    if (!d.ok) {
      alert(d.error || 'Error al enviar comando')

  }
}

    '<div style="font-size:14px;font-weight:700;color:' + info.color + '">' + info.label + '</div>' +
    '<div style="font-size:12px;color:var(--muted)">Confirmar alerta de emergencia.<br>Se notificara a la central.</div>' +
    '<div style="display:flex;gap:10px;width:100%;margin-top:4px">' +
    '<button class="mod-btn secondary" onclick="accionPanico()" style="flex:1">Volver</button>' +
    '<button class="mod-btn danger" onclick="confirmarPanico(\''+ tipo +'\')" style="flex:1">ENVIAR</button></div></div>'
}

async function confirmarPanico(tipo) {
  tipo = tipo || 'sonoro'
  if (panicoCooldown) return
  panicoCooldown = true
  document.getElementById('modulo-body').innerHTML = '<div class="mod-spinner">Enviando alerta...</div>'
  let lat = null, lng = null
  if (tipo === 'ayuda' && navigator.geolocation) {
    try {
      const pos = await new Promise((res,rej) => navigator.geolocation.getCurrentPosition(res,rej,{timeout:15000,enableHighAccuracy:true,maximumAge:0}))
      lat = pos.coords.latitude; lng = pos.coords.longitude
    } catch {}
  }
  try {
    const r = await fetch(API_BASE + '/api/modulo/panico', {
      method:'POST',
      headers:{ Authorization:'Bearer '+(getToken()||''), 'Content-Type':'application/json' },
      body: JSON.stringify({ tipo, lat, lng })
    })
    const d = await r.json()
    if (d.ok) {
      document.getElementById('modulo-body').innerHTML = `
        <div class="mod-card" style="border-color:rgba(16,185,129,.4);align-items:center;text-align:center;gap:14px">
          <div style="font-size:44px">✅</div>
          <div style="font-size:15px;font-weight:700;color:var(--green)">Alerta enviada</div>
          <div style="font-size:12px;color:var(--muted)">La central de monitoreo fue notificada</div>
          <button class="mod-btn secondary" onclick="cerrarModulo()" style="margin-top:4px;width:100%">Cerrar</button>
        </div>
      `
      setEstado('panico','PÁNICO'); beepPanic()
      if (navigator.vibrate) navigator.vibrate([300,100,300,100,300])
      // Auto-normalizar: re-consultar el estado real del panel luego de 90s
      setTimeout(async () => {
        try {
          const hdr = { Authorization: 'Bearer ' + (getToken() || '') }
          const r   = await fetch(API_BASE + '/api/modulo/alarma', { headers: hdr })
          const d   = await r.json()
          if (d.ok) {
            if      (d.estado === 'armado')    setEstado('armado','Armado')
            else if (d.estado === 'desarmado') setEstado('desarmado','Desarmado')
            else                               setEstado('armado','Armado') // fallback
          }
        } catch {}
      }, 90000)
    } else {
      document.getElementById('modulo-body').innerHTML = `<div class="mod-error">${d.error||'No se pudo enviar la alerta'}</div>`
      beepErr()
    }
  } catch {
    document.getElementById('modulo-body').innerHTML = '<div class="mod-error">Error de conexión</div>'
    beepErr()
  }
  setTimeout(() => { panicoCooldown = false }, 30000)
}

// ════════════════════════════════════════════════════
//  ASISTENCIA PERSONAL (PEDIDO DE AYUDA)
// ════════════════════════════════════════════════════
let _asistenciaId = null
let _asistenciaStatInterval = null
let _asistenciaInterval = null
let _tiempoAyuda = Date.now()

function accionAyuda() {
  document.getElementById('modulo-titulo').textContent = 'Pedir Ayuda'
  document.getElementById('modulo-body').innerHTML =
    '<div class="mod-card" style="border-color:rgba(99,102,241,.3);align-items:center;text-align:center;gap:14px">' +
    '<div style="font-size:38px">🆘</div>' +
    '<div style="font-size:14px;font-weight:700;color:rgba(99,102,241,.9)">Pedir Ayuda Personal</div>' +
    '<div style="font-size:12px;color:var(--muted)">Se notificará al operador con tu ubicación en tiempo real.</div>' +
    '<div style="display:flex;gap:10px;width:100%;margin-top:4px">' +
    '<button class="mod-btn secondary" onclick="cerrarModulo()" style="flex:1">Cancelar</button>' +
    '<button class="mod-btn" onclick="confirmarAyuda()" style="flex:1;background:rgba(99,102,241,.8);border-color:rgba(99,102,241,.4)">PEDIR AYUDA</button></div></div>'
  document.getElementById('modulo-panel').classList.add('show')
  if (navigator.vibrate) navigator.vibrate([50,30,50])
}

let _asistenciaWatchId = null  // watchPosition id para GPS continuo

async function confirmarAyuda() {
  // Enviar ayuda INMEDIATAMENTE — no esperar GPS (puede tardar minutos si el chip está frío)
  document.getElementById('modulo-body').innerHTML = '<div class="mod-spinner">Enviando pedido de ayuda...</div>'
  // Intentar obtener una posición rápida en paralelo (baja precisión, max 3s, caché ok)
  let lat = null, lng = null
  try {
    const quickPos = await Promise.race([
      new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej,
        { timeout: 3000, enableHighAccuracy: false, maximumAge: 60000 })),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 3000))
    ])
    lat = quickPos.coords.latitude
    lng = quickPos.coords.longitude
  } catch {}
  try {
    const r = await fetch(API_BASE + '/api/asistencia', {
      method:'POST',
      headers:{ Authorization:'Bearer '+(getToken()||''), 'Content-Type':'application/json' },
      body: JSON.stringify({ lat, lng })
    })
    const d = await r.json()
    if (d.ok && d.asistencia_id) {
      _asistenciaId = d.asistencia_id
      _tiempoAyuda = Date.now()
      // watchPosition: GPS continuo sin reiniciar la adquisición cada vez
      // Mucho más rápido que setInterval+getCurrentPosition para el primer fix
      if (navigator.geolocation) {
        _asistenciaWatchId = navigator.geolocation.watchPosition(
          async (pos) => {
            if (!_asistenciaId) return
            try {
              await fetch(API_BASE + '/api/asistencia/' + _asistenciaId + '/gps', {
                method:'POST',
                headers:{ Authorization:'Bearer '+(getToken()||''), 'Content-Type':'application/json' },
                body: JSON.stringify({ lat: pos.coords.latitude, lng: pos.coords.longitude })
              })
            } catch {}
          },
          () => {},
          { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
        )
      }
      _mostrarEstadoAyuda()
      // Polling estado cada 30s (fallback si VoIP no llega)
      _asistenciaStatInterval = setInterval(async () => {
        if (!_asistenciaId) { clearInterval(_asistenciaStatInterval); return }
        try {
          const rs = await fetch(API_BASE + '/api/asistencia/' + _asistenciaId + '/estado', {
            headers: { Authorization: 'Bearer ' + (getToken() || '') }
          })
          if (rs.ok) { const ds = await rs.json(); if (ds.estado === 'resuelta') _manejarAyudaResuelta() }
        } catch {}
      }, 30000)
    } else {
      document.getElementById('modulo-body').innerHTML = '<div class="mod-error">' + (d.error||'No se pudo enviar el pedido') + '</div>'
      beepErr()
    }
  } catch {
    document.getElementById('modulo-body').innerHTML = '<div class="mod-error">Error de conexión</div>'
    beepErr()
  }
}

function _mostrarEstadoAyuda() {
  document.getElementById('modulo-body').innerHTML =
    '<div class="mod-card" style="border-color:rgba(99,102,241,.4);align-items:center;text-align:center;gap:12px">' +
    '<div style="font-size:38px">🆘</div>' +
    '<div style="font-size:14px;font-weight:700;color:rgba(99,102,241,.9)">AYUDA ENVIADA</div>' +
    '<div style="font-size:12px;color:var(--muted)">El operador fue notificado.<br>Compartiendo ubicación GPS en tiempo real.</div>' +
    '<button class="mod-btn" onclick="cancelarAyuda()" style="width:100%;margin-top:8px;background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.4);color:rgba(16,185,129,.9)">✅ Estoy bien — Cancelar ayuda</button>' +
    '</div>'
  if (navigator.vibrate) navigator.vibrate([300,100,300,100,300])
}

async function cancelarAyuda() {
  if (!_asistenciaId) { cerrarModulo(); return }
  clearInterval(_asistenciaInterval)
  clearInterval(_asistenciaStatInterval)
  _asistenciaInterval = null
  _asistenciaStatInterval = null
  try {
    await fetch(API_BASE + '/api/asistencia/' + _asistenciaId + '/cancelar', {
      method:'POST',
      headers:{ Authorization:'Bearer '+(getToken()||''), 'Content-Type':'application/json' }
    })
  } catch {}
  _asistenciaId = null
  document.getElementById('modulo-body').innerHTML =
    '<div class="mod-card" style="border-color:rgba(16,185,129,.4);align-items:center;text-align:center;gap:14px">' +
    '<div style="font-size:44px">✅</div>' +
    '<div style="font-size:15px;font-weight:700;color:var(--green)">Asistencia cancelada</div>' +
    '<div style="font-size:12px;color:var(--muted)">El operador fue informado de que estás bien.</div>' +
    '<button class="mod-btn secondary" onclick="cerrarModulo()" style="margin-top:4px;width:100%">Cerrar</button></div>'
}

// ════════════════════════════════════════════════════
//  VOIP — COMUNICACIÓN DIRECTA CON RECEPTOR
// ════════════════════════════════════════════════════
let _voipSocket   = null
let _voipPc       = null
let _voipStream   = null
let _voipActiva   = false

function voipConectar() {
  const token = getToken()
  if (!token || _voipSocket) return
  _voipSocket = io('https://lima.limenseguridad.com', {
    path: '/voip',
    auth: { token },
    transports: ['polling', 'websocket'],
    reconnection: true,
    reconnectionDelay: 3000
  })
  _voipSocket.on('connect', () => {
    _voipSocket.emit('registrar_apk', token)
  })
  _voipSocket.on('voip_llamada', voipAtender)
  _voipSocket.on('asistencia_resuelta', () => { if (_asistenciaId) _manejarAyudaResuelta() })
  _voipSocket.on('voip_ice',    (d) => {
    if (_voipPc && d.candidate) {
      try { _voipPc.addIceCandidate(new RTCIceCandidate(d.candidate)) } catch {}
    }
  })
  _voipSocket.on('voip_colgar', voipColgar)

  // PTT walkie-talkie: active=true → operador habla (Lima muta mic)
  //                    active=false → Lima habla (Lima activa mic)
  _voipSocket.on('voip_ptt', function(d) {
    if (_voipStream) _voipStream.getTracks().forEach(function(t) { t.enabled = !d.active })
    // Beep corto para indicar cambio de turno
    try {
      var _bCtx = new (window.AudioContext || window.webkitAudioContext)()
      var _bOsc = _bCtx.createOscillator()
      var _bGain = _bCtx.createGain()
      _bOsc.connect(_bGain); _bGain.connect(_bCtx.destination)
      _bOsc.frequency.value = d.active ? 880 : 660
      _bGain.gain.setValueAtTime(0.3, _bCtx.currentTime)
      _bGain.gain.exponentialRampToValueAtTime(0.001, _bCtx.currentTime + 0.15)
      _bOsc.start(); _bOsc.stop(_bCtx.currentTime + 0.15)
      setTimeout(function() { try { _bCtx.close() } catch {} }, 300)
    } catch (_be) {}
    // Actualizar overlay
    var ov = document.getElementById('voip-overlay')
    if (ov) {
      var ind = ov.querySelector('#voip-ptt-ind')
      if (ind) ind.textContent = d.active ? '🎙 Operador hablando...' : '🗣 Tu turno — habla ahora'
    }
  })
}

function voipDesconectar() {
  if (_voipSocket) { _voipSocket.disconnect(); _voipSocket = null }
  voipColgar()
}

let _voipCountdownTimer = null
let _voipPendingData    = null

function voipAtender(data) {
  if (_voipActiva) return
  _voipPendingData = data
  _voipActiva = true
  if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300])
  // Cancelar TTS — en algunos Android bloquea el hardware de audio para getUserMedia
  try { window.speechSynthesis.cancel() } catch {}

  // Liberar audio en background mientras muestra el contador
  if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null }
  if (analyser) { analyser = null }
  if (audioCtx) { try { audioCtx.close().catch(function(){}) } catch {} ; audioCtx = null }
  if (micStream) { try { micStream.getTracks().forEach(function(t) { t.stop() }) } catch {} ; micStream = null }
  if (grabando && mediaRecorder) { try { mediaRecorder.stop() } catch {} ; grabando = false }

  var secs = 5
  var overlay = document.getElementById('voip-overlay')
  if (!overlay) {
    overlay = document.createElement('div')
    overlay.id = 'voip-overlay'
    overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0a0008;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px'
    document.body.appendChild(overlay)
  }

  function renderContador(n) {
    overlay.innerHTML =
      '<div style="width:100%;text-align:center;background:rgba(239,68,68,.18);border:2px solid rgba(239,68,68,.7);border-radius:16px;padding:20px 16px;margin-bottom:4px">' +
        '<div style="font-size:13px;font-weight:800;letter-spacing:2px;color:#ef4444;text-transform:uppercase;margin-bottom:6px">⚠ EMERGENCIA — LIMEN SEGURIDAD ⚠</div>' +
        '<div style="font-size:15px;font-weight:700;color:#fff;margin-bottom:4px">Un operador lo está contactando</div>' +
        '<div style="font-size:12px;color:rgba(255,255,255,.6)">Identificará el problema y coordinará la ayuda</div>' +
      '</div>' +
      '<div style="font-size:64px;font-weight:900;color:#ef4444;font-variant-numeric:tabular-nums;line-height:1">' + n + '</div>' +
      '<div style="font-size:11px;color:rgba(255,255,255,.45)">Atendiendo automáticamente en ' + n + ' segundo' + (n!==1?'s':'') + '...</div>' +
      '<button onclick="_contestarVoip()" style="width:100%;background:#ef4444;border:none;color:#fff;padding:20px;border-radius:14px;font-size:18px;font-weight:800;cursor:pointer;letter-spacing:.5px">📲 ATENDER AHORA</button>' +
      '<button onclick="_rechazarVoip()" style="width:100%;background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.5);padding:12px;border-radius:14px;font-size:13px;cursor:pointer">Colgar / Rechazar</button>'
  }

  overlay.style.display = 'flex'
  renderContador(secs)

  _voipCountdownTimer = setInterval(function() {
    secs--
    if (secs <= 0) {
      clearInterval(_voipCountdownTimer)
      _voipCountdownTimer = null
      _contestarVoip()
    } else {
      renderContador(secs)
    }
  }, 1000)
}

function _rechazarVoip() {
  if (_voipCountdownTimer) { clearInterval(_voipCountdownTimer); _voipCountdownTimer = null }
  _voipPendingData = null
  _voipActiva = false
  _voipOcultarUI()
  if (_voipSocket) _voipSocket.emit('voip_colgar_apk')
}

async function _contestarVoip() {
  if (_voipCountdownTimer) { clearInterval(_voipCountdownTimer); _voipCountdownTimer = null }
  var data = _voipPendingData
  _voipPendingData = null
  if (!data) return

  // Mostrar spinner mientras conecta
  var overlay = document.getElementById('voip-overlay')
  if (overlay) overlay.innerHTML =
    '<div style="font-size:48px">🎙️</div>' +
    '<div style="color:#ef4444;font-size:16px;font-weight:800;letter-spacing:1px">Conectando con operador...</div>' +
    '<div style="color:rgba(255,255,255,.5);font-size:12px">Iniciando audio de emergencia</div>'

  try {
    // getUserMedia debe ser la PRIMERA operacion async tras el gesto del usuario.
    // Mismo constraint que la grabacion de voz (que funciona en este dispositivo).
    _voipStream = await navigator.mediaDevices.getUserMedia({ audio: true })
    console.log('[VoIP] getUserMedia OK')
    _voipPc = new RTCPeerConnection({
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        {
          urls: [
            'turn:openrelay.metered.ca:80',
            'turn:openrelay.metered.ca:443',
            'turn:openrelay.metered.ca:443?transport=tcp'
          ],
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ]
    })
    _voipStream.getTracks().forEach(t => _voipPc.addTrack(t, _voipStream))
    _voipPc.onicecandidate = (e) => {
      if (e.candidate && _voipSocket) {
        _voipSocket.emit('voip_ice_apk', { candidate: e.candidate })
      }
    }
    _voipPc.ontrack = (e) => {
      let audio = document.getElementById('voip-remote-audio')
      if (!audio) { audio = document.createElement('audio'); audio.id='voip-remote-audio'; audio.autoplay=true; document.body.appendChild(audio) }
      audio.srcObject = e.streams[0]
    }
    await _voipPc.setRemoteDescription(new RTCSessionDescription(data.offer))
    if (!_voipActiva) { try { _voipPc.close() } catch {}; _voipPc = null; return }
    const answer = await _voipPc.createAnswer()
    if (!_voipActiva) { try { _voipPc.close() } catch {}; _voipPc = null; return }
    await _voipPc.setLocalDescription(answer)
    if (!_voipActiva) return
    // PTT: Lima empieza con mic activo (su turno por defecto)
    if (_voipStream) _voipStream.getTracks().forEach(function(t) { t.enabled = true })
    if (_voipSocket) _voipSocket.emit('voip_answer', { answer })
  } catch (e) {
    const en = (e && e.name) ? e.name : 'Error'
    const em = (e && e.message) ? e.message : ''
    console.error('[VoIP] _contestarVoip fallo:', en, em)
    const _ov = document.getElementById('voip-overlay')
    if (_ov) {
      // Recopilar diagnostico de dispositivos de audio
      var diagHtml = '<div style="color:#ef4444;font-size:13px;padding:20px;text-align:center;max-height:70vh;overflow-y:auto">' +
        '<div style="font-size:28px;margin-bottom:8px">⚠️</div>' +
        '<div style="font-weight:700">Error VoIP: ' + en + '</div>' +
        '<div style="font-size:11px;opacity:.7;margin:4px 0 12px">' + em + '</div>'
      // Mostrar estado del audio de LIMA
      diagHtml += '<div style="background:rgba(255,255,255,.05);border-radius:6px;padding:8px;font-size:10px;text-align:left;margin-bottom:10px;color:#94a3b8">' +
        '<div style="color:#c084fc;font-weight:700;margin-bottom:4px">Estado audio LIMA:</div>' +
        '<div>micStream: ' + (micStream ? 'ACTIVO ⚠️' : 'libre ✓') + '</div>' +
        '<div>grabando: ' + (grabando ? 'SI ⚠️' : 'no ✓') + '</div>' +
        '<div>audioCtx: ' + (audioCtx ? 'ACTIVO ⚠️' : 'libre ✓') + '</div>' +
        '</div>'
      _ov.innerHTML = diagHtml + '<div id="voip-diag-devices" style="font-size:10px;color:#64748b;margin-bottom:10px">Comprobando dispositivos...</div>' +
        '<button onclick="voipColgar()" style="background:#1c0a35;border:1px solid rgba(239,68,68,.4);color:#ef4444;padding:10px 20px;border-radius:8px;cursor:pointer">Cerrar</button>' +
        '</div>'
      // Enumerar dispositivos de audio disponibles
      if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
        navigator.mediaDevices.enumerateDevices().then(function(devs) {
          var inputs = devs.filter(function(d) { return d.kind === 'audioinput' })
          var el = document.getElementById('voip-diag-devices')
          if (el) {
            if (inputs.length === 0) {
              el.innerHTML = '<span style="color:#ef4444">⚠️ No se detectaron micrófonos</span>'
            } else {
              el.innerHTML = '🎙️ Micrófonos detectados: ' + inputs.length + '<br>' +
                inputs.map(function(d) { return '• ' + (d.label || 'Sin nombre') }).join('<br>')
              el.style.color = '#10b981'
            }
          }
        }).catch(function() {})
      }
    } else {
      _voipActiva = false
      if (_voipSocket) _voipSocket.emit('voip_colgar_apk')
    }
  }
}

function voipColgar() {
  // Guard: si ya esta colgado, no hacer nada
  if (!_voipActiva && !_voipCountdownTimer && !_voipPendingData && !_voipPc && !_voipStream) return
  if (_voipCountdownTimer) { clearInterval(_voipCountdownTimer); _voipCountdownTimer = null }
  _voipPendingData = null
  _voipActiva = false

  // Cerrar PeerConnection primero (sincrono, no bloquea)
  const _pc = _voipPc; _voipPc = null
  if (_pc) { try { _pc.close() } catch {} }

  // Detener tracks en setTimeout para no bloquear el hilo UI de Android WebView
  const _st = _voipStream; _voipStream = null
  if (_st) { setTimeout(function() { try { _st.getTracks().forEach(function(t) { t.stop() }) } catch {} }, 0) }

  const audio = document.getElementById('voip-remote-audio')
  if (audio) { audio.srcObject = null; audio.remove() }
  _voipOcultarUI()
  if (_voipSocket) _voipSocket.emit('voip_colgar_apk')
}

function _voipMostrarUI() {
  let overlay = document.getElementById('voip-overlay')
  if (!overlay) {
    overlay = document.createElement('div')
    overlay.id = 'voip-overlay'
    overlay.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(10,0,17,.92);border:1px solid rgba(16,185,129,.4);border-radius:16px;padding:14px 20px;z-index:9999;display:flex;align-items:center;gap:14px;min-width:260px;backdrop-filter:blur(12px)'
    overlay.innerHTML = '<div style="font-size:24px">🎙️</div><div style="flex:1"><div style="font-size:13px;font-weight:700;color:#10b981">Comunicación Directa</div><div id="voip-ptt-ind" style="font-size:11px;color:#f59e0b;font-weight:600">🗣 Tu turno — habla ahora</div></div><button onclick="voipColgar()" style="background:rgba(239,68,68,.8);border:none;border-radius:10px;color:#fff;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer">COLGAR</button>'
    document.body.appendChild(overlay)
  }
  overlay.style.display = 'flex'
  if (navigator.vibrate) navigator.vibrate([100,50,100])
}

function _voipOcultarUI() {
  const overlay = document.getElementById('voip-overlay')
  if (overlay) overlay.style.display = 'none'
}

function _manejarAyudaResuelta() {
  if (!_asistenciaId) return
  clearInterval(_asistenciaInterval)
  clearInterval(_asistenciaStatInterval)
  if (_asistenciaWatchId !== null) {
    try { navigator.geolocation.clearWatch(_asistenciaWatchId) } catch {}
    _asistenciaWatchId = null
  }
  _asistenciaInterval = null
  _asistenciaStatInterval = null
  _asistenciaId = null

function hablarRespuesta(texto) {
  if (!ttsEnabled || !texto) {
    setAvatarState('idle')
    setWaveState('idle')
    actualizarBtnMic()
    return
  }
  window.speechSynthesis.cancel()
  const utter = new SpeechSynthesisUtterance(texto)
  utter.lang  = 'es-AR'
  utter.rate  = 1.05
  utter.pitch = 1.0
  utter.onstart = () => {
    setAvatarState('speaking')
    setWaveState('speaking')
  }
  utter.onboundary = (e) => {
    if (e.name === 'word') {
      // Pulso de amplitud por cada palabra
      voiceWave.target = 18 + Math.random() * 16
      voiceWave.freq   = 2.5 + Math.random() * 3
      // Decae suavemente hasta el próximo pulso
      clearTimeout(voiceWave._t)
      voiceWave._t = setTimeout(() => { voiceWave.target = 8 + Math.random() * 8 }, 120)
    }
  }
  utter.onend = () => {
    setAvatarState('idle')
    setWaveState('idle')
    actualizarBtnMic()
  }
  utter.onerror = () => {
    setAvatarState('idle')
    setWaveState('idle')
    actualizarBtnMic()
  }
  window.speechSynthesis.speak(utter)
}

let audioChunks    = []

function detenerSilenceDetector() {
  if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null }
  if (analyser)     { analyser = null }
  if (audioCtx)     { try { audioCtx.close() } catch {} ; audioCtx = null }
}

function iniciarSilenceDetector(stream) {
  try {
    audioCtx  = new (window.AudioContext || window.webkitAudioContext)()
    analyser  = audioCtx.createAnalyser()
    analyser.fftSize = 512
    const src = audioCtx.createMediaStreamSource(stream)
    src.connect(analyser)
    const buf = new Uint8Array(analyser.frequencyBinCount)
    let silentMs = 0
    const UMBRAL    = 8    // nivel mínimo de sonido
    const SILENCIO  = 1800 // ms de silencio para cortar
    const MIN_AUDIO = 800  // ms mínimos grabando antes de cortar por silencio

    let startTime = Date.now()

    function checkSilence() {
      if (!grabando || !analyser) return
      analyser.getByteTimeDomainData(buf)
      let sum = 0
      for (let i = 0; i < buf.length; i++) sum += Math.abs(buf[i] - 128)
      const nivel = sum / buf.length

      if (nivel < UMBRAL) {
        silentMs += 100
        if (silentMs >= SILENCIO && (Date.now() - startTime) >= MIN_AUDIO) {
          if (typeof window._detenerActual === "function") window._detenerActual(); else mediaRecorder?.stop()
          return
        }
      } else {
        silentMs = 0
      }
      silenceTimer = setTimeout(checkSilence, 100)
    }
    silenceTimer = setTimeout(checkSilence, 100)
  } catch (e) {
    console.warn('[LIMA] Silence detector no disponible:', e.message)
  }
}

async function iniciarEscucha(retryCount = 0) {
  if (grabando) return
  if (!navigator.mediaDevices?.getUserMedia) {
    actualizarBtnMic()
    toast('Micrófono no disponible en este dispositivo', 't-err')
    return
  }
  // Release any lingering stream and AudioContext before requesting new one
  // On Android, hardware doesn't release instantly — need a brief delay after stop()
  if (audioCtx) { try { audioCtx.close() } catch {} ; audioCtx = null ; analyser = null }
  if (micStream) {
    try { micStream.getTracks().forEach(t => t.stop()) } catch {}
    micStream = null
    await new Promise(r => setTimeout(r, 600))  // esperar liberación del hardware en Android
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } })
    micStream = stream

    // ── PCM via ScriptProcessorNode (funciona en Android WebView a diferencia de MediaRecorder) ──
    const pcmCtx = new (window.AudioContext || window.webkitAudioContext)()
    const pcmSR  = pcmCtx.sampleRate
    const pcmSrc = pcmCtx.createMediaStreamSource(stream)
    const BUFSIZE = 2048
    const proc   = pcmCtx.createScriptProcessor(BUFSIZE, 1, 1)
    let pcmChunks = []
    let recStartTime = Date.now()
    let silentMs = 0
    const UMBRAL   = 0.012  // RMS minimo para considerar sonido
    const SILENCIO = 1800   // ms de silencio para cortar
    const MIN_DUR  = 600    // ms minimos grabando

    function detenerPCM() {
      if (!grabando) return
      grabando = false
      if (safetyTimer) { clearTimeout(safetyTimer); safetyTimer = null }
      try { proc.disconnect() } catch {}
      try { pcmSrc.disconnect() } catch {}
      stream.getTracks().forEach(t => t.stop())
      micStream = null
      pcmCtx.close().catch(() => {})
      actualizarBtnMic()

      // Construir WAV
      const total = pcmChunks.reduce((a, c) => a + c.length, 0)
      if (total < pcmSR * 0.4) { setAvatarState('idle'); return }
      const pcm = new Float32Array(total)
      let off = 0
      for (const c of pcmChunks) { pcm.set(c, off); off += c.length }

      // Encode WAV
      const wavLen = pcm.length * 2
      const buf = new ArrayBuffer(44 + wavLen)
      const dv = new DataView(buf)
      const ws = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)) }
      ws(0,'RIFF'); dv.setUint32(4, 36 + wavLen, true); ws(8,'WAVE')
      ws(12,'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true)
      dv.setUint16(22, 1, true); dv.setUint32(24, pcmSR, true)
      dv.setUint32(28, pcmSR * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true)
      ws(36,'data'); dv.setUint32(40, wavLen, true)
      for (let i = 0, p = 44; i < pcm.length; i++, p += 2) {
        const s = Math.max(-1, Math.min(1, pcm[i]))
        dv.setInt16(p, s < 0 ? s * 0x8000 : s * 0x7FFF, true)
      }
      const blob = new Blob([buf], { type: 'audio/wav' })

      // Enviar a Whisper
      ;(async () => {
        setAvatarState('processing')
        const fd = new FormData()
        fd.append('audio', blob, 'audio.wav')
        try {
          const r = await fetch(API_BASE + '/api/transcribir', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + (getToken() || '') },
            body: fd
          })
          const d = await r.json()
          if (d.texto?.trim()) {
            inp.value = d.texto.trim()
            enviar()
          } else {
            setAvatarState('idle')
            actualizarBtnMic()
          }
        } catch {
          setAvatarState('idle')
          actualizarBtnMic()
          toast('Error al procesar audio', 't-err')
        }
      })()
    }

    proc.onaudioprocess = (e) => {
      if (!grabando) return
      const data = e.inputBuffer.getChannelData(0)
      pcmChunks.push(new Float32Array(data))
      // Deteccion de silencio via RMS
      let rms = 0
      for (let i = 0; i < data.length; i++) rms += data[i] * data[i]
      rms = Math.sqrt(rms / data.length)
      const elapsed = Date.now() - recStartTime
      if (rms < UMBRAL) {
        silentMs += (BUFSIZE / pcmSR) * 1000
        if (silentMs >= SILENCIO && elapsed >= MIN_DUR) detenerPCM()
      } else {
        silentMs = 0
      }
    }

    // Override toggleMic para detener con ScriptProcessor
    const _origDetener = window._detenerActual
    window._detenerActual = detenerPCM

    pcmSrc.connect(proc)
    proc.connect(pcmCtx.destination)

    grabando = true
    recStartTime = Date.now()
    setAvatarState('listening')
    actualizarBtnMic()
    if (navigator.vibrate) navigator.vibrate(50)

    // Timer de seguridad: max 12s
    let safetyTimer = setTimeout(() => { if (grabando) detenerPCM() }, 12000)

  } catch (e) {
    console.error('[MIC] Error:', e.name, e.message)
    if (e.name === 'NotAllowedError') {
      actualizarBtnMic()
      toast('Permiso de micrófono denegado', 't-err')
    } else if (e.name === 'NotFoundError') {
      actualizarBtnMic()
      toast('Sin micrófono', 't-err')
    } else if (e.name === 'NotReadableError') {
      // Mic is busy — auto-retry up to 3 times with increasing delay before showing error
      if (retryCount < 3) {
        const delay = (retryCount + 1) * 2500  // 2.5s, 5s, 7.5s
        console.warn('[MIC] NotReadableError, reintentando en', delay, 'ms (intento', retryCount + 1, 'de 3)')
        setTimeout(() => iniciarEscucha(retryCount + 1), delay)
        return
      }
      actualizarBtnMic()
      // Show message with retry button in chat (only after all retries failed)
      document.getElementById('chat-empty').style.display = 'none'
      const wrap = document.createElement('div'); wrap.className = 'msg lima'
      wrap.innerHTML = '<div class="msg-av" style="background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center">L</div>' +
        '<div class="msg-inner"><div class="msg-bubble" style="display:flex;flex-direction:column;gap:6px">' +
        '<span>Micrófono ocupado. Cerrá otras apps que usen el micrófono y reintentá.</span>' +
        '<button onclick="reintentarMic(this)" style="background:var(--p);color:#fff;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:11px;font-weight:700;letter-spacing:1px">🎙 REINTENTAR</button>' +
        '</div></div>'
      document.getElementById('chat').insertBefore(wrap, document.getElementById('typing'))
    } else {
      actualizarBtnMic()
      toast('Mic error: ' + e.name, 't-err')
    }
  }
}

// Reintentar mic desde botón en chat (después de NotReadableError)
function reintentarMic(btn) {
  if (btn) btn.disabled = true
  // Ensure previous stream is fully released before retrying
  if (micStream) { try { micStream.getTracks().forEach(t => t.stop()) } catch {} ; micStream = null }
  setTimeout(() => {
    iniciarEscucha()
  }, 1200)
}

async function hacerLogin() {
  const email = document.getElementById('l-email').value.trim()
  const pass  = document.getElementById('l-pass').value
  const err   = document.getElementById('login-err')
  const btn   = document.getElementById('btn-login')
  err.textContent = ''
  if(!email||!pass) { err.textContent='Completá email y contraseña'; return }
  btn.disabled=true
  const intentarLogin = async (intento) => {
    btn.textContent = intento === 1 ? 'VERIFICANDO...' : 'REINTENTANDO...'
    const ctrl = new AbortController()
    const tid  = setTimeout(() => ctrl.abort(), 8000)
    try {
      const r = await fetch(API_BASE + '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pass }),
        signal: ctrl.signal
      })
      clearTimeout(tid)
      const d = await r.json()
      if (!r.ok) { err.textContent = d.error || 'Email o contraseña incorrectos'; return false }
      localStorage.setItem(TK, d.token)
      localStorage.setItem(UK, JSON.stringify(d.usuario))
      localStorage.setItem(MK, JSON.stringify(d.modulos || []))
      if (window.LimaAndroid) window.LimaAndroid.saveToken(d.token)
      document.getElementById('login').classList.add('hide')
      iniciar()
      return true
    } catch (e) {
      clearTimeout(tid)
      if (e.name === 'AbortError') {
        err.textContent = intento < 2 ? 'Sin respuesta, reintentando...' : 'Servidor no responde. Verificá tu conexión.'
      } else if (!navigator.onLine) {
        err.textContent = 'Sin conexión a internet.'
        return false  // no reintentar si no hay red
      } else {
        err.textContent = intento < 2 ? 'Error de red, reintentando...' : 'No se pudo conectar al servidor.'
      }
      return false
    }
  }
  try {
    const ok = await intentarLogin(1)
    if (!ok && err.textContent.includes('reintentando')) {
      await new Promise(r => setTimeout(r, 2500))
      await intentarLogin(2)
    }
  } finally {
    btn.disabled = false; btn.textContent = 'INGRESAR'
  }
}

    var cams = await r.json()

    if (!cams.length) {
      mb.innerHTML = '<div style="text-align:center;padding:32px;color:var(--muted);font-size:13px">Sin camaras asignadas</div>'
      return
    }

    mb.innerHTML = cams.map(function(c) {
      return '<div class="cam-card" id="cam-' + c.id + '">' +
        '<div class="cam-header">' +
          '<span class="cam-name">' + c.nombre + '</span>' +
          '<span class="cam-loc">' + (c.ubicacion || '') + '</span>' +
        '</div>' +
        '<div class="cam-player-wrap">' +
          '<video id="vid-' + c.id + '" class="cam-video" playsinline autoplay muted></video>' +
          '<div class="cam-overlay" id="ovl-' + c.id + '">' +
            '<button class="cam-play-btn" onclick="playCamera(' + c.id + ',\'' + c.sn + '\',' + (c.canal||0) + ',' + JSON.stringify(c.password||'') + ',' + JSON.stringify(c.usuario||'admin') + ')">' +
              '<span style="font-size:28px">▶</span><br>' +
              '<span style="font-size:11px;opacity:.8">Ver en vivo</span>' +
            '</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    }).join('')

  } catch(e) {
    mb.innerHTML = '<div style="text-align:center;padding:32px;color:var(--red);font-size:12px">Error: ' + e.message + '</div>'
  }
}

async function playCamera(camId, sn, canal, devPass, devUser) {
  var ovl = document.getElementById('ovl-' + camId)
  var vid = document.getElementById('vid-' + camId)
  if (ovl) ovl.innerHTML = '<div style="color:var(--muted);font-size:11px;padding:8px">Conectando...</div>'

  try {
    var hdr = { Authorization: 'Bearer ' + (getToken() || '') }
    var r = await fetch(API_BASE + '/api/camaras/' + camId + '/hls', {
      method: 'POST',
      headers: Object.assign({}, hdr, { 'Content-Type': 'application/json' }),
      body: JSON.stringify({ sn: sn, canal: canal, password: devPass, usuario: devUser })
    })
    var d = await r.json()
    if (!d.ok) throw new Error(d.error || 'Sin URL')

    if (!d.hls_url) throw new Error('URL HLS no disponible')
    var hlsUrl = API_BASE + d.hls_url
    var token = getToken() || ''

    if (ovl) ovl.style.display = 'none'

    if (window.Hls && Hls.isSupported()) {
      var hls = new Hls({
        enableWorker: false,
        lowLatencyMode: true,
        xhrSetup: function(xhr) { xhr.setRequestHeader('Authorization', 'Bearer ' + token) }
      })
      hls.loadSource(hlsUrl)
      hls.attachMedia(vid)
      hls.on(Hls.Events.ERROR, function(ev, data) {
        if (data.fatal && ovl) {
          ovl.style.display = 'flex'
          ovl.innerHTML = '<div style="color:var(--red);font-size:11px;padding:8px">Error de stream</div>'
        }
      })
      _hlsInstances.push(hls)
      vid.play().catch(function() {})
    } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
      vid.src = hlsUrl  // native HLS (iOS Safari)
      vid.play().catch(function() {})
    } else {
      throw new Error('HLS no soportado en este dispositivo')
    }
  } catch(e) {
    if (ovl) {
      ovl.style.display = 'flex'
      ovl.innerHTML = '<div style="color:var(--red);font-size:11px;padding:8px">' + e.message + '</div>'
    }
  }
}
